name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Cheap, and the tree is prettier-clean today. Catches an editor or an
      # agent reformatting a file so the next review diff is signal, not noise.
      - name: Check formatting
        run: npm run format:check
      - name: Type-check & build
        run: npm run build
      - name: Run core + CLI tests
        run: npm test
      - name: Run CLI end-to-end tests
        run: npm run test:cli-e2e
      # The site's download links are built from a repo URL hardcoded in
      # docs/. It was hand-transcribed once with the wrong owner casing and
      # every download on the live site 404'd, because GitHub does not redirect
      # on owner-name case. This fails the build if docs/ and package.json
      # disagree about which repo this is.
      - name: Check repo URL consistency
        run: npm run sync-repo-url
      # The version list is the other half: a well-formed link to a release
      # that does not exist is still a 404, and that is exactly what shipped.
      # Needs a token only to avoid the anonymous rate limit on large forks.
      - name: Check advertised versions are published
        run: npm run check-releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  gui-headless:
    name: GUI smoke (headless Linux)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      # Electron has no working headless mode on Linux; the suite provisions a
      # virtual X server itself (see e2e/display.ts), so this job proves that
      # path rather than relying on a runner image that happens to have one.
      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Run GUI smoke tests (forced headless)
        run: npm run test:gui:headless
        env:
          SHADOWBIT_E2E_TEST: "1"
        timeout-minutes: 10

  gui-smoke:
    name: GUI + NFR tests (Electron + Playwright)
    runs-on: macos-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Install Playwright
        run: npx playwright install --with-deps chromium
      # The spec reporter, not the default TAP. TAP buries an assertion's
      # `message` inside an `error: |-` block, and node:test prints a failed
      # `before()` hook once per top-level suite at the very END of the stream —
      # so a failure can read as a wall of `cancelledByParent` with the
      # identifying message nowhere near the test it belongs to. spec names the
      # assertion inline, which is the difference between a 5-minute triage and
      # an instant one.
      - name: Run GUI smoke tests
        run: npm run test:gui:spec
        env:
          SHADOWBIT_E2E_TEST: "1"
        timeout-minutes: 5
      - name: Run accessibility NFR tests (WCAG 2.2 AA)
        run: npm run test:a11y
        timeout-minutes: 10
      - name: Run responsive NFR tests
        run: npm run test:responsive
        timeout-minutes: 10
      - name: Run performance NFR tests
        run: npm run test:perf
        timeout-minutes: 10
