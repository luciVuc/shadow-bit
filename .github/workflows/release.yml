name: Release

on:
  push:
    tags:
      - "v*"

# Only one release build at a time. Without this, two pushes close together
# race to upload artifacts into the same release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Least privilege by default; only the jobs that publish need write access.
permissions:
  contents: read

jobs:
  build-test:
    name: Build & test before release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      # The CLI E2E suite carries the version-consistency assertions: they are
      # the tripwire that tells you package.json and the version literals baked
      # into docs/ have drifted. Skipping them here is how a release ships a site
      # advertising the wrong build.
      - name: Run CLI end-to-end tests
        run: npm run test:cli-e2e

  # GUI smoke tests gate the release too. They previously ran only on PRs,
  # which let a stale assertion (hardcoded container version) survive all the
  # way to a tag push.
  gui-smoke:
    name: GUI smoke tests before release
    runs-on: macos-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Install Playwright
        run: npx playwright install --with-deps chromium
      - name: Run GUI smoke tests
        run: npm run test:gui
        env:
          SHADOWBIT_E2E_TEST: "1"
        timeout-minutes: 5
      # The NFR suites (WCAG 2.2 AA, responsive, asset budget, docs
      # self-containment) only need headless Chromium, and run in the GUI job
      # because that is where Playwright is installed. They gate packaging too:
      # shipping an accessibility regression or a docs page that reaches for a
      # CDN is exactly the kind of defect a release should not carry.
      - name: Run NFR suites (a11y, responsive, perf, site)
        run: npm run test:nfr
        timeout-minutes: 20

  package:
    name: Package (${{ matrix.os }})
    needs: [build-test, gui-smoke]
    strategy:
      fail-fast: false
      matrix:
        include:
          # `dir` is the release/<platform>/ subdirectory that scripts/package.mjs
          # scopes each build to. The version segment is added at upload time
          # from the built package.json (see the `version` step), because it has
          # to be the version the artifacts actually carry -- a hardcoded string
          # here would go stale the moment a release is cut from a different
          # commit. Uploading that ONE version directory rather than all of
          # release/ is deliberate: the runner image is clean, but the glob is the
          # only thing standing between a future cross-target build and an
          # artifact from another platform or version landing in this release.
          # Paths are relative to the workspace root because upload-artifact globs
          # from there, not from the `path` directory.
          # `artifact` is the upload glob. It is anchored on the version
          # directory built above, and it deliberately does NOT include the
          # `*-unpacked` trees — see the comment on the upload step.
          # `{v}` is a literal placeholder, NOT GitHub expression syntax: the
          # matrix is expanded before any step runs, so `steps.version.outputs`
          # is not available here. The upload step substitutes the version it
          # read from package.json.
          - os: macos-latest
            target: mac
            artifact: "release/macos/{v}/*.{dmg,zip}"
          - os: windows-latest
            target: win
            artifact: "release/windows/{v}/*.exe"
          - os: ubuntu-latest
            target: linux
            artifact: "release/linux/{v}/*.{AppImage,deb}"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Read version
        id: version
        # The single source of truth for the version, read from the same
        # package.json electron-builder will read. Sourced rather than echoed so
        # a drifted tag (v2.0.0 pushed from a 1.9.9 package.json) surfaces here
        # instead of publishing a release whose directory lies about its
        # contents.
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Build
        run: npm run build
      # Export the signing variables ONLY when the corresponding secret exists.
      #
      # An `env:` block cannot express that: `secrets.X` for an unset secret is
      # the empty string, which still DEFINES the variable. electron-builder
      # then sees CSC_KEY_PASSWORD as present, attempts signing with an empty
      # password, and the macOS job dies at a bare
      #   /Users/runner/... not a file
      # Leaving the variables undefined is what makes electron-builder skip
      # signing and build an unsigned .dmg / .exe. Those publish fine; they
      # just trip Gatekeeper / SmartScreen on first launch, which the download
      # page already warns the visitor about.
      #
      # To produce SIGNED artifacts, set these repository secrets:
      #   MAC_CERT_P12 / MAC_CERT_PASSWORD   Developer ID "Application" (.p12)
      #   APPLE_ID / APPLE_APP_PASSWORD / APPLE_TEAM_ID   notarization
      #   WIN_CERT_PFX / WIN_CERT_PASSWORD   Windows code signing (.pfx)
      # electron-builder notarizes automatically once APPLE_ID and APPLE_TEAM_ID
      # are present, and `mac.hardenedRuntime` plus
      # resources/entitlements.mac.plist are already configured for it. (The
      # entitlements live in resources/, not build/ - build/ is gitignored as
      # generated output, so a plist there would never be committed.)
      - name: Configure code signing
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CERT_PFX }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
        # Explicit bash: this matrix leg runs on windows-latest, where the
        # default `run` shell is PowerShell. The `${!v:-}` indirection and
        # `>> "$GITHUB_ENV"` below are bash, and PowerShell parses neither -
        # it failed with a bare "Process completed with exit code 1".
        shell: bash
        run: |
          signed=0
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID \
                   APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID \
                   WIN_CSC_LINK WIN_CSC_KEY_PASSWORD; do
            if [ -n "${!v:-}" ]; then
              echo "$v=${!v}" >> "$GITHUB_ENV"
              signed=1
            fi
          done
          if [ "$signed" = "1" ]; then
            echo "Code signing: configured" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Code signing: none - artifacts will be **unsigned**" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Package
        # The wrapper scopes the output to release/<platform>/<version>/ and
        # forwards the target flag. `--publish never` still holds: publishing
        # happens once, in the separate `publish` job, so three runners cannot
        # race to create the same release.
        run: node scripts/package.mjs ${{ matrix.target }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Upload ONLY the installers, never the unpacked app tree.
      #
      # `path: <version dir>/` uploads win-unpacked/, linux-unpacked/,
      # mac-arm64/ and every .pak and .dylib inside them — 79 files for the
      # Windows leg alone. Those then collide during the merge-multiple
      # download in `publish` (locale.pak and friends exist in every tree),
      # and the collision is not a merge conflict so it is silent: the v1.1.4
      # run produced a release with 27 unpacked-app files attached as assets
      # and NO Windows installer at all, because "ShadowBit Setup 1.1.4.exe"
      # was one of the files a same-named upload clobbered.
      #
      # So each leg uploads exactly the artifacts its platform produces. If a
      # platform ever starts producing a different extension, that leg's glob
      # has to change too — which is the correct place for that change to be
      # visible.
      - name: Resolve artifact glob
        id: glob
        run: echo "path=${{ matrix.artifact }}" | sed "s/{v}/${{ steps.version.outputs.v }}/" >> "$GITHUB_OUTPUT"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: ${{ steps.glob.outputs.path }}
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # `merge-multiple` is safe only now that each leg uploads installers
      # with distinct names. With the unpacked trees included it flattened
      # three platforms' worth of identically-named library files into one
      # directory and silently dropped the Windows installer.
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts/
          merge-multiple: true

      # The Release is what makes the artifacts durable AND what the website's
      # download buttons point at: docs/data.js builds every href as
      # /releases/download/v<version>/<artifact> against the GitHub Release for
      # that tag. There is no copy served from docs/. So a draft release means
      # every download link on the site is a 404 until someone clicks publish —
      # the one manual step that can silently break the product's front door.
      #
      # Publishing is gated on the checks instead: this job `needs: package`,
      # which needs both the Linux test job and the macOS GUI/NFR job, so the
      # tests are the gate, not a human. If you want a human approval step
      # before publishing, do it by making the release require manual approval
      # in the repository's Actions settings rather than by reverting to a
      # draft here — the draft's cost is broken download links, which is a
      # worse failure than an unwanted release.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**/*
          generate_release_notes: true
          # Fail loudly rather than publishing a release whose tag does not
          # match the version the artifacts were built from. Without this, a
          # tag pushed from the wrong commit produces a release directory that
          # lies about its contents, and the site's links 404 against it.
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
